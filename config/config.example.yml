# Matrix 配置示例（复制为 config/config.yml 后按需修改）

system:
  env: development  # development | production

storage:
  data_dir: ./data       # 业务数据根（相对 cwd 或绝对路径）

logging:
  dir: ./logs
  level: debug           # debug | info | warn | error
  format: text           # system 日志格式：text | json
  access_format: combined
  structured_format: json
  retention_days: 30     # 每类日志保留天数

server:
  addr: ":8080"          # HTTP 监听地址
  read_timeout: 30s

database:
  # URI 格式；TimeZone 直接写 Asia/Shanghai，勿用 Asia%2FShanghai
  dsn: postgres://matrix:matrix@localhost:5432/matrix?sslmode=disable&TimeZone=Asia/Shanghai
  max_open_conns: 25
  auto_migrate: true     # GORM 自动建表
  sql_migrate: true      # 执行内嵌 SQL 版本化迁移

auth:
  session:
    cookie_name: _matrix_session
    ttl: 720h
    secure: false        # 生产环境 HTTPS 下设为 true
  bootstrap:
    admin_username: root
    admin_password: "${MATRIX_BOOTSTRAP_PASSWORD:-changeme}"  # 首装管理员密码
